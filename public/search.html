<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TIME BACK公式サイト内の情報を検索します。">
  <link rel="icon" href="images/logo.png" type="image/png">
  <title>サイト内検索｜TIME BACK</title>
  <style>
    :root {
      --ink: #153b38;
      --muted: #607774;
      --green: #087f72;
      --green-dark: #05645b;
      --mint: #dff5ef;
      --mint-pale: #f3fbf9;
      --line: #d8e7e3;
      --paper: #fff;
      --navy: #102e2c;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; color: var(--ink); background: #f7fbfa; font-family: "Yu Gothic", "YuGothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; line-height: 1.75; }
    body.archive-open { overflow: hidden; }
    a { color: inherit; }
    button, input { font: inherit; }

    .skip-link { position: fixed; top: 8px; left: 8px; z-index: 2000; padding: 8px 12px; color: #fff; background: var(--navy); transform: translateY(-150%); }
    .skip-link:focus { transform: translateY(0); }

    .site-header { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(216, 231, 227, .88); background: rgba(255, 255, 255, .94); backdrop-filter: blur(14px); }
    .header-inner { width: min(1180px, calc(100% - 40px)); min-height: 76px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
    .brand-logo-crop { position: relative; flex: 0 0 auto; width: 42px; height: 42px; overflow: hidden; border-radius: 50%; background: #fff; }
    .brand-logo { position: absolute; top: -13px; left: -21px; width: 84px; height: 84px; max-width: none; }
    .brand-name { color: #07346e; font-size: 1.14rem; font-weight: 800; letter-spacing: .13em; white-space: nowrap; }

    .global-nav ul { display: flex; align-items: center; gap: 5px; margin: 0; padding: 0; list-style: none; }
    .global-nav a { display: block; padding: 10px 13px; border-radius: 8px; font-size: .83rem; font-weight: 700; text-decoration: none; transition: color .18s ease, background .18s ease; }
    .global-nav a:hover, .global-nav a:focus-visible { color: var(--green-dark); background: var(--mint-pale); }

    .site-search { flex: 0 0 auto; }
    .search-form { display: flex; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #f8fbfa; transition: border-color .18s ease, box-shadow .18s ease; }
    .search-form:focus-within { border-color: #55aa9e; box-shadow: 0 0 0 3px rgba(8, 127, 114, .1); }
    .search-input { width: 210px; height: 42px; padding: 0 12px; border: 0; outline: none; color: var(--ink); background: transparent; font-size: .84rem; }
    .search-input::placeholder { color: #82928f; }
    .search-submit { display: grid; width: 42px; height: 42px; padding: 0; place-items: center; border: 0; color: #fff; background: var(--green); cursor: pointer; transition: background .18s ease; }
    .search-submit:hover, .search-submit:focus-visible { background: var(--green-dark); }
    .search-submit svg { width: 17px; height: 17px; }

    main { min-height: calc(100vh - 159px); padding: 76px 0 100px; }
    .search-page { width: min(900px, calc(100% - 40px)); margin: 0 auto; }
    .page-eyebrow { margin: 0 0 7px; color: var(--green); font-size: .76rem; font-weight: 800; letter-spacing: .17em; }
    .search-title { margin: 0; color: var(--navy); font-size: clamp(1.8rem, 4vw, 2.7rem); line-height: 1.45; letter-spacing: .03em; overflow-wrap: anywhere; }
    .search-title span { color: var(--green); }
    .search-meta { margin: 13px 0 0; color: var(--muted); font-size: .9rem; }

    .results-container { display: grid; gap: 14px; margin-top: 38px; }
    .result-item { padding: 25px 27px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 10px 30px rgba(18, 71, 65, .055); }
    .result-title { margin: 0; font-size: 1.12rem; }
    .result-title a { color: var(--green-dark); text-decoration-thickness: 1px; text-underline-offset: 5px; }
    .result-title a:hover, .result-title a:focus-visible { color: var(--green); }
    .result-snippet { margin: 10px 0 0; color: var(--muted); font-size: .91rem; }
    .no-results { padding: 38px 30px; border: 1px dashed #b8ceca; border-radius: 13px; color: var(--muted); background: rgba(255, 255, 255, .65); text-align: center; }
    .no-results p { margin: 0; }
    .no-results p + p { margin-top: 8px; font-size: .84rem; }

    .site-footer { border-top: 1px solid #284946; color: #cfdbd9; background: var(--navy); }
    .footer-inner { width: min(1180px, calc(100% - 40px)); min-height: 82px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .fiction-notice { margin: 0; font-size: .67rem; line-height: 1.7; }
    .archive-button { flex: 0 0 auto; min-width: 122px; padding: 10px 14px; border: 1px solid #64817e; border-radius: 7px; color: #fff; background: transparent; font-size: .76rem; font-weight: 800; letter-spacing: .12em; cursor: pointer; }
    .archive-button:hover, .archive-button:focus-visible { border-color: #81dac8; color: #81dac8; }

    .archive-overlay { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 20px; background: rgba(7, 25, 23, .72); opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s ease; }
    .archive-overlay.is-open { opacity: 1; visibility: visible; }
    .archive-dialog { width: min(540px, 100%); max-height: min(700px, calc(100vh - 40px)); overflow: hidden; border: 1px solid #a9beb9; border-radius: 12px; color: var(--ink); background: #f8fbfa; box-shadow: 0 25px 70px rgba(0, 0, 0, .36); transform: translateY(10px); transition: transform .18s ease; }
    .archive-overlay.is-open .archive-dialog { transform: translateY(0); }
    .archive-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 20px; color: #fff; background: var(--navy); }
    .archive-header h2 { margin: 0; font-size: 1.05rem; letter-spacing: .08em; }
    .archive-close { width: 35px; height: 35px; padding: 0; border: 1px solid #68817f; border-radius: 50%; color: #fff; background: transparent; font-size: 1.3rem; line-height: 1; cursor: pointer; }
    .archive-content { max-height: calc(100vh - 120px); overflow: auto; padding: 20px; }
    .archive-description { margin: 0 0 15px; color: var(--muted); font-size: .79rem; line-height: 1.7; }
    .archive-list { display: block; max-height: 390px; margin: 0; padding: 0; overflow-y: auto; border-top: 1px solid var(--line); list-style: none; }
    .archive-entry { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 12px; padding: 12px 11px; border-bottom: 1px solid var(--line); color: var(--ink); background: #fff; text-decoration: none; }
    a.archive-entry:hover, a.archive-entry:focus-visible { background: #edfaf7; }
    .archive-entry.is-locked { color: #94a29f; background: #f1f5f4; cursor: default; user-select: none; }
    .archive-number { color: var(--green); font: 800 .77rem/1 Consolas, monospace; }
    .archive-entry.is-locked .archive-number { color: #94a29f; }
    .archive-title { font-size: .86rem; }
    .archive-entry.is-locked .archive-title { letter-spacing: .16em; }
    .archive-tools { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .archive-reset-button, .reset-actions button { padding: 8px 12px; border: 1px solid #9aafaa; border-radius: 6px; color: var(--ink); background: #fff; font-size: .76rem; cursor: pointer; }
    .archive-reset-button { color: #805152; border-color: #c6a9aa; }
    .reset-confirm { margin-top: 13px; padding: 14px; border-radius: 8px; color: #586966; background: #eaf3f1; font-size: .79rem; }
    .reset-confirm p { margin: 0 0 11px; }
    .reset-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .reset-actions .danger { color: #fff; border-color: #97595b; background: #97595b; }

    @media (max-width: 1080px) {
      .header-inner { gap: 15px; }
      .search-input { width: 118px; }
      .global-nav a { padding-inline: 8px; }
    }

    @media (max-width: 880px) {
      .header-inner { min-height: auto; padding: 17px 0 13px; flex-direction: column; gap: 9px; }
      .site-search { width: min(100%, 500px); }
      .search-input { width: 100%; }
      .global-nav { width: 100%; overflow-x: auto; }
      .global-nav ul { justify-content: center; min-width: 460px; }
    }

    @media (max-width: 580px) {
      .header-inner, .footer-inner { width: min(100% - 28px, 1180px); }
      .search-page { width: calc(100% - 28px); }
      .brand-name { font-size: 1rem; }
      .global-nav { overflow: visible; }
      .global-nav ul { display: grid; min-width: 0; grid-template-columns: repeat(2, 1fr); gap: 2px 6px; }
      .global-nav a { padding: 7px 5px; font-size: .76rem; text-align: center; white-space: nowrap; }
      main { padding: 55px 0 74px; }
      .result-item { padding: 22px 20px; }
      .footer-inner { padding: 18px 0; align-items: flex-end; }
      .fiction-notice { font-size: .59rem; }
      .archive-button { min-width: 95px; padding-inline: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="TIME BACK トップページ">
        <span class="brand-logo-crop" aria-hidden="true">
          <img class="brand-logo" src="images/logo.png" width="1254" height="1254" alt="">
        </span>
        <span class="brand-name">TIME BACK</span>
      </a>
      <nav class="global-nav" aria-label="メインナビゲーション">
        <ul>
          <li><a href="about.html">サービスについて</a></li>
          <li><a href="pricing.html">料金・報酬</a></li>
          <li><a href="safety.html">安全性について</a></li>
          <li><a href="faq.html">よくある質問</a></li>
        </ul>
      </nav>
      <div class="site-search">
        <form class="search-form" action="search.html" method="get" role="search">
          <label class="skip-link" for="searchInput">サイト内検索</label>
          <input class="search-input" id="searchInput" name="q" type="search" placeholder="サイト内検索" autocomplete="off">
          <button class="search-submit" type="submit" aria-label="検索する">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"></circle>
              <path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="search-page" aria-labelledby="searchTitle">
      <p class="page-eyebrow">SITE SEARCH</p>
      <h1 class="search-title" id="searchTitle">「<span id="queryDisplay"></span>」の検索結果</h1>
      <p class="search-meta" id="resultCountMeta"></p>
      <div class="results-container" id="resultsContainer"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="fiction-notice">このサイトの内容はフィクションです。登場する人物・団体・名称等は架空のものであり、実在のものとは関係ありません。</p>
      <button class="archive-button" id="archiveButton" type="button" aria-haspopup="dialog" aria-controls="archiveOverlay">EX</button>
    </div>
  </footer>

  <div class="archive-overlay" id="archiveOverlay" aria-hidden="true">
    <section class="archive-dialog" role="dialog" aria-modal="true" aria-labelledby="archiveTitle">
      <header class="archive-header">
        <h2 id="archiveTitle">ページアーカイブ</h2>
        <button class="archive-close" id="archiveClose" type="button" aria-label="ページアーカイブを閉じる">×</button>
      </header>
      <div class="archive-content">
        <p class="archive-description">一度訪れたページが記録されます。解放済みのページを選ぶと、そのページへ戻れます。未探索のページは「？？？」と表示されます。</p>
        <ol class="archive-list" id="archiveList"></ol>
        <div class="archive-tools">
          <button class="archive-reset-button" id="archiveResetButton" type="button">アーカイブをリセット</button>
          <div class="reset-confirm" id="resetConfirm" role="alertdialog" aria-labelledby="resetTitle" hidden>
            <p id="resetTitle">探索済みページの記録を消去しますか？</p>
            <div class="reset-actions">
              <button id="resetCancel" type="button">キャンセル</button>
              <button class="danger" id="resetAccept" type="button">リセットする</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const searchDatabase = [
      {
        keywords: ['TIME BACK ID'],
        title: 'TIME BACK ID ご利用ガイド',
        url: 'time-back-id.html',
        description: 'TIME BACK IDの形式、アプリでの確認方法、使用する場面、安全な取扱いについてご案内します。'
      },
      {
        keywords: ['行動支援システム', '行動支援技術', 'Behavior Assistance System'],
        title: 'Behavior Assistance System',
        url: 'behavior-assistance.html',
        description: 'TIME BACKの行動支援システムについて、日常動作のサポート、利用の流れ、安全設計と情報保護をご紹介します。'
      },
      {
        keywords: ['TIME BACK MARKET'],
        title: 'TIME BACK MARKET',
        url: 'market.html',
        description: '時間の取引規模、月次の市場動向、取引時間の内訳と購入した時間の活用例をご紹介します。売買はTIME BACKアプリで行えます。'
      },
      {
        keywords: ['TIME BACK', 'タイムバック', 'サービス', '時間売却', '時間を売る'],
        title: 'TIME BACK サービス概要',
        url: 'about.html',
        description: '使わない時間を預け、新しい価値として受け取るTIME BACKのサービス概要です。'
      },
      {
        keywords: ['利用方法', '使い方', '時間を選ぶ', '預ける', '報酬', 'アプリ'],
        title: 'TIME BACKの利用方法',
        url: 'about.html#flow-title',
        description: '時間の選択から、いつも通りの日常を過ごし、報酬を受け取るまでの流れをご案内します。'
      },
      {
        keywords: ['時間購入', '時間を買う', '購入', '買取', '買う'],
        title: '時間を買う',
        url: 'about.html#market-choices',
        description: '追加される体感時間を購入し、引き伸ばされた時間を仕事や学習、創作などに活用するサービスです。'
      },
      {
        keywords: ['料金', '料金表', '価格', '売却価格', '購入料金'],
        title: '料金・報酬',
        url: 'pricing.html',
        description: 'TIME BACKの時間売却報酬と、時間購入料金をご案内します。'
      },
      {
        keywords: ['安全', '安全性', '行動支援', 'モニタリング', 'サポート'],
        title: '安全性について',
        url: 'safety.html',
        description: 'TIME BACK利用中の日常行動を支える技術と、24時間のモニタリング体制についてご説明します。'
      },
      {
        keywords: ['よくある質問', 'FAQ', '利用条件', 'キャンセル', '登録'],
        title: 'よくある質問',
        url: 'faq.html',
        description: 'サービスの利用方法、時間の売買、安全性、登録や料金についての質問をまとめています。'
      },
      {
        keywords: ['利用規約', '規約', '禁止事項', '個人情報', 'プライバシー', 'Chronect', 'クロネクト'],
        title: '利用規約',
        url: 'terms.html',
        description: 'Chronectが提供するTIME BACKの利用条件、キャンセル、安全対応、個人情報の取扱いについて定めています。'
      },
      {
        keywords: ['問い合わせ', 'お問い合わせ', '連絡', 'サポート窓口'],
        title: 'お問い合わせ',
        url: 'contact.html',
        description: 'サービスの利用、取引、安全性、法人導入に関するお問い合わせを受け付けています。'
      },
      {
        keywords: ['ビジネスプラン'],
        title: 'TIME BACK FOR BUSINESS',
        url: 'business.html',
        description: '法人向けの時間調達、チームへの配分、利用管理、安全運用についてご案内します。'
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');
    const searchInput = document.getElementById('searchInput');
    const queryDisplay = document.getElementById('queryDisplay');
    const resultCountMeta = document.getElementById('resultCountMeta');
    const resultsContainer = document.getElementById('resultsContainer');

    function addMessage(primary, secondary) {
      const box = document.createElement('div');
      const firstLine = document.createElement('p');
      box.className = 'no-results';
      firstLine.textContent = primary;
      box.appendChild(firstLine);
      if (secondary) {
        const secondLine = document.createElement('p');
        secondLine.textContent = secondary;
        box.appendChild(secondLine);
      }
      resultsContainer.appendChild(box);
    }

    if (query && query.trim()) {
      const sanitizedQuery = query.trim();
      const normalizedQuery = sanitizedQuery.toLocaleLowerCase('ja');
      searchInput.value = sanitizedQuery;
      queryDisplay.textContent = sanitizedQuery;

      const matchedResults = searchDatabase.filter((item) =>
        item.keywords.some((keyword) => keyword.toLocaleLowerCase('ja') === normalizedQuery)
      );

      resultCountMeta.textContent = `該当するページが ${matchedResults.length} 件見つかりました。`;

      if (matchedResults.length) {
        matchedResults.forEach((result) => {
          const article = document.createElement('article');
          const heading = document.createElement('h2');
          const link = document.createElement('a');
          const snippet = document.createElement('p');
          article.className = 'result-item';
          heading.className = 'result-title';
          link.href = result.url;
          link.textContent = result.title;
          snippet.className = 'result-snippet';
          snippet.textContent = result.description;
          heading.appendChild(link);
          article.append(heading, snippet);
          resultsContainer.appendChild(article);
        });
      } else {
        addMessage('入力されたキーワードに一致するページは見つかりませんでした。', '別のキーワードで再度検索してください。');
      }
    } else {
      queryDisplay.textContent = '未入力';
      resultCountMeta.textContent = 'キーワードを入力して検索してください。';
      addMessage('検索キーワードが指定されていません。');
    }

    const archiveStorageKey = 'timeback-page-archive-v1';
    const totalPages = 60;
    const archiveTitleByNumber = {
      1: 'トップページ ｜ TIME BACK',
      2: 'サービスについて ｜ TIME BACK',
      3: '料金・報酬 ｜ TIME BACK',
      4: '安全性について ｜ TIME BACK',
      5: 'よくある質問 ｜ TIME BACK',
      6: '利用規約 ｜ TIME BACK',
      7: 'お問い合わせ ｜ TIME BACK',
      8: 'TIME BACK MARKET ｜ TIME BACK',
      9: 'Behavior Assistance System ｜ TIME BACK',
      10: 'TIME BACK ID ご利用ガイド ｜ TIME BACK',
      13: '法人向け案内 ｜ TIME BACK for Business',
      14: '法人向けサービス ｜ TIME BACK for Business',
      15: '活用シーン ｜ TIME BACK for Business',
      16: '法人向け安全管理 ｜ TIME BACK for Business',
      17: '導入の流れ ｜ TIME BACK for Business'
    };
    const archiveButton = document.getElementById('archiveButton');
    const archiveOverlay = document.getElementById('archiveOverlay');
    const archiveClose = document.getElementById('archiveClose');
    const archiveList = document.getElementById('archiveList');
    const archiveResetButton = document.getElementById('archiveResetButton');
    const resetConfirm = document.getElementById('resetConfirm');
    const resetCancel = document.getElementById('resetCancel');
    const resetAccept = document.getElementById('resetAccept');

    function loadArchive() {
      try {
        const saved = JSON.parse(localStorage.getItem(archiveStorageKey) || '[]');
        if (!Array.isArray(saved)) return [];
        const pages = saved
          .filter((page) => !String(page.href || '').startsWith('search.html'))
          .map((page) => {
            const movedNumber = {'business.html':13,'business-service.html':14,'business-cases.html':15,'business-safety.html':16,'business-flow.html':17}[page.href];
            const migrated = movedNumber ? { ...page, number: movedNumber } : page;
            return archiveTitleByNumber[migrated.number]
              ? { ...migrated, title: archiveTitleByNumber[migrated.number] }
              : migrated;
          });
        if (JSON.stringify(pages) !== JSON.stringify(saved)) {
          localStorage.setItem(archiveStorageKey, JSON.stringify(pages));
        }
        return pages;
      } catch (error) { return []; }
    }

    function renderArchive() {
      const pages = loadArchive();
      archiveList.textContent = '';
      for (let pageNumber = 1; pageNumber <= totalPages; pageNumber += 1) {
        const page = pages.find((savedPage) => savedPage.number === pageNumber);
        const item = document.createElement('li');
        const entry = document.createElement(page ? 'a' : 'div');
        const number = document.createElement('span');
        const title = document.createElement('span');
        entry.className = 'archive-entry';
        number.className = 'archive-number';
        title.className = 'archive-title';
        number.textContent = String(pageNumber).padStart(2, '0');
        if (page) {
          entry.href = page.href;
          title.textContent = page.title;
        } else {
          entry.classList.add('is-locked');
          title.textContent = '？？？';
        }
        entry.append(number, title);
        item.appendChild(entry);
        archiveList.appendChild(item);
      }
    }

    function openArchive() {
      renderArchive();
      resetConfirm.hidden = true;
      archiveOverlay.classList.add('is-open');
      archiveOverlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('archive-open');
      archiveClose.focus();
    }

    function closeArchive() {
      resetConfirm.hidden = true;
      archiveOverlay.classList.remove('is-open');
      archiveOverlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('archive-open');
      archiveButton.focus();
    }

    archiveButton.addEventListener('click', openArchive);
    archiveClose.addEventListener('click', closeArchive);
    archiveOverlay.addEventListener('click', (event) => { if (event.target === archiveOverlay) closeArchive(); });
    archiveResetButton.addEventListener('click', () => { resetConfirm.hidden = false; resetCancel.focus(); });
    resetCancel.addEventListener('click', () => { resetConfirm.hidden = true; archiveResetButton.focus(); });
    resetAccept.addEventListener('click', () => {
      try { localStorage.removeItem(archiveStorageKey); }
      catch (error) { return; }
      window.location.href = 'index.html';
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || !archiveOverlay.classList.contains('is-open')) return;
      if (!resetConfirm.hidden) { resetConfirm.hidden = true; archiveResetButton.focus(); }
      else closeArchive();
    });
  </script>
</body>
</html>
