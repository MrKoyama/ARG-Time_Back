<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850">
<title>位置関係の検討図・制作者用</title>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#177ab1"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#cc6a22"/></marker></defs>
<rect width="1120" height="850" fill="#fff"/>
<g font-family="'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif" fill="#27343d">
<text x="40" y="44" font-size="25" font-weight="700">位置関係の検討図</text><text x="40" y="74" font-size="14" fill="#6e7780">制作者用：研究施設の位置・入口も表示 ／ 縮尺・道路の細部は未確定</text>
<path d="M210 235H400V130H720V490H805" fill="none" stroke="#edf0f3" stroke-width="42" stroke-linejoin="round"/>
<path d="M720 130V690" fill="none" stroke="#edf0f3" stroke-width="42"/>
<path d="M110 405H608V675H805" fill="none" stroke="#f7eee5" stroke-width="32" stroke-linejoin="round"/>
<rect x="65" y="132" width="235" height="72" rx="7" fill="#e8eef4" stroke="#8d9ca9" stroke-width="2"/><text x="182" y="177" font-size="24" text-anchor="middle" font-weight="700">明浜駅</text>
<rect x="190" y="300" width="270" height="210" rx="7" fill="#e9f3e5" stroke="#85a278" stroke-width="2"/><text x="325" y="355" font-size="23" text-anchor="middle" font-weight="700">公園</text><text x="325" y="384" font-size="14" text-anchor="middle">銀色のオブジェ</text><text x="325" y="476" font-size="15" text-anchor="middle">園内を通り抜ける</text>
<rect x="488" y="315" width="60" height="62" fill="#f0f1f2" stroke="#b7bfc5"/><rect x="488" y="431" width="60" height="62" fill="#f0f1f2" stroke="#b7bfc5"/><text x="518" y="347" text-anchor="middle" font-size="13">住宅</text><text x="518" y="466" text-anchor="middle" font-size="13">住宅</text>
<text x="518" y="417" text-anchor="middle" font-size="12" fill="#73583f">細い道</text>
<rect x="570" y="250" width="78" height="370" rx="5" fill="#fff1d9" stroke="#c8ac79" stroke-width="2"/>
<text x="609" y="355" text-anchor="middle" font-size="24" font-weight="700"><tspan x="609">商</tspan><tspan x="609" dy="38">店</tspan><tspan x="609" dy="38">街</tspan></text><text x="609" y="597" text-anchor="middle" font-size="13">南端</text>
<rect x="805" y="185" width="250" height="130" rx="7" fill="#e5eff7" stroke="#759bb5" stroke-width="2"/><text x="930" y="242" text-anchor="middle" font-size="23" font-weight="700">TIME BACK 本社</text><text x="930" y="274" text-anchor="middle" font-size="14">西側の道路から入る</text>
<rect x="805" y="405" width="250" height="150" rx="7" fill="#e4f2f3" stroke="#64979c" stroke-width="2"/><text x="930" y="470" text-anchor="middle" font-size="23" font-weight="700">実証エリア</text><text x="930" y="506" text-anchor="middle" font-size="14">西側の道路から入る</text>
<path d="M790 587H1070" stroke="#83929a" stroke-width="5" stroke-dasharray="8 6"/><rect x="814" y="571" width="235" height="30" fill="#fff"/><text x="931" y="592" text-anchor="middle" font-size="14" fill="#8e4848">敷地の区切り・通り抜け不可</text>
<rect x="805" y="625" width="250" height="110" rx="7" fill="#f6e8e4" stroke="#af7d6c" stroke-width="2"/><text x="942" y="669" text-anchor="middle" font-size="21" font-weight="700">秘匿された研究施設</text><text x="942" y="704" text-anchor="middle" font-size="13">公開地図では無記名・一部だけ表示</text>
<path d="M805 650V703" stroke="#cc6a22" stroke-width="8"/><text x="785" y="644" text-anchor="end" font-size="15" font-weight="700" fill="#a44f15">西側入口</text>
<path d="M210 210V235H400V130H720V480H790" fill="none" stroke="#177ab1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M720 250H790" fill="none" stroke="#177ab1" stroke-width="5" marker-end="url(#blue)"/>
<text x="420" y="113" font-size="14" fill="#177ab1">商店街の北側を回る</text>
<path d="M100 405H590" fill="none" stroke="#cc6a22" stroke-width="5" stroke-linecap="round" marker-end="url(#orange)"/>
<path d="M609 452V675H790" fill="none" stroke="#cc6a22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="48" y="359" font-size="14" fill="#a44f15"><tspan x="48">投稿者の</tspan><tspan x="48" dy="22">出発方面</tspan></text>
<text x="630" y="709" font-size="14" fill="#a44f15">商店街の南端から路地へ</text>
<path d="M40 786H104" stroke="#177ab1" stroke-width="5"/><text x="120" y="792" font-size="16">駅からの正規ルート</text><path d="M420 786H484" stroke="#cc6a22" stroke-width="5"/><text x="500" y="792" font-size="16">投稿者の移動経路（売却中）</text>
<text x="40" y="827" font-size="14" fill="#68737c">※公園経由は投稿者の出発地点からの近道。街全体を一本道にする想定ではありません。</text>
</g>
</svg>
